name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff black pytest httpx
        
    - name: Lint with Ruff & Black
      run: |
        black --check . || echo "Black issues found"
        ruff check . || echo "Ruff issues found"
        
    - name: Validate Cards
      run: |
        python scripts/validate_cards.py
        
    - name: Run Pytest
      run: |
        pytest tests/
        
    - name: Build Docker Image
      run: |
        docker build -t verdant .
