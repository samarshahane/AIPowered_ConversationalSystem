metrics:
  - id: "soc_percent"
    name: "Soil Organic Carbon"
    unit: "%"
    description: "Percentage of organic carbon in soil"
  - id: "water_holding_capacity"
    name: "Water Holding Capacity"
    unit: "mm/m"
    description: "Available water capacity in the root zone"
  - id: "pollinator_abundance"
    name: "Pollinator Abundance"
    unit: "index"
    description: "Relative abundance of wild pollinators"
  - id: "soil_erosion_rate"
    name: "Soil Erosion Rate"
    unit: "t/ha/yr"
    description: "Rate of soil loss"
  - id: "biodiversity_index"
    name: "Habitat Biodiversity"
    unit: "index"
    description: "General index of local floral and faunal diversity"
